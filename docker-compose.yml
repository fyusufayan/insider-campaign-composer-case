# Smart Campaign Composer — local stack.
#
#   docker compose up --build        → http://localhost:8000
#
# Start order (each step must succeed before the next one starts):
#   postgres (healthy) → migrate (exit 0) → seed (exit 0) → api (ready) → frontend
# A failed migration or seed stops the chain: api and frontend are not started.
#
# Delivery (CP16): mockprovider (fake SMS/email provider, sends nothing) starts
# once api is healthy (it runs the image the api service builds); worker starts
# once mockprovider is healthy.
# Exactly one worker replica (ARCHITECTURE §2): never scale it.
# Neither the worker nor the mock provider sees any LLM setting or API key.
#
# Every value below can be overridden from the shell or a local, uncommitted
# .env file (see .env.example). No secret has a committed value: the database
# password is a local-only development default, and ANTHROPIC_API_KEY is empty
# unless you export it (empty + LLM_PROVIDER=auto → demo provider).

name: campaign-composer

# One backend image (ADR-001) built once, by the api service; migrate and seed
# run other entrypoints of the same image and never pull it.
x-backend: &backend
  image: campaign-composer/backend:local
  pull_policy: never
  environment: &backend-env
    DATABASE_URL: postgres://${POSTGRES_USER:-composer}:${POSTGRES_PASSWORD:-composer}@postgres:5432/${POSTGRES_DB:-composer}?sslmode=disable
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-composer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-composer}
      POSTGRES_DB: ${POSTGRES_DB:-composer}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not published to the host; use `docker compose exec postgres psql -U composer`.
    healthcheck:
      # TCP on 127.0.0.1: the image's temporary init server listens on the unix
      # socket only, so this turns healthy only once initialization is complete.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  # One-shot: applies the embedded migrations; a no-op when up to date.
  migrate:
    <<: *backend
    command: ["/app/migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # One-shot: loads the deterministic 5,000-user dataset only when the users
  # table is empty (fresh volume); otherwise it does nothing. Never -reset here.
  seed:
    <<: *backend
    command: ["/app/seed"]
    environment:
      <<: *backend-env
      SEED_USERS: ${SEED_USERS:-5000}
      SEED_RANDOM_SEED: ${SEED_RANDOM_SEED:-42}
      SEED_REFERENCE_TIME: ${SEED_REFERENCE_TIME:-2026-11-01T00:00:00Z}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    <<: *backend
    build:
      context: ./backend
    command: ["/app/api"]
    environment:
      <<: *backend-env
      HTTP_ADDR: ":8080"
      # auto → anthropic iff ANTHROPIC_API_KEY is non-empty, otherwise demo.
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MAX_RETRIES: ${CLAUDE_MAX_RETRIES:-2}
      CLAUDE_SEGMENT_MODEL: ${CLAUDE_SEGMENT_MODEL:-claude-haiku-5-5}
      CLAUDE_SEGMENT_EFFORT: ${CLAUDE_SEGMENT_EFFORT:-low}
      CLAUDE_SEGMENT_TIMEOUT: ${CLAUDE_SEGMENT_TIMEOUT:-45s}
      CLAUDE_SEGMENT_MAX_TOKENS: ${CLAUDE_SEGMENT_MAX_TOKENS:-4000}
      CLAUDE_CONTENT_MODEL: ${CLAUDE_CONTENT_MODEL:-claude-opus-5-5}
      CLAUDE_CONTENT_EFFORT: ${CLAUDE_CONTENT_EFFORT:-medium}
      CLAUDE_CONTENT_TIMEOUT: ${CLAUDE_CONTENT_TIMEOUT:-90s}
      CLAUDE_CONTENT_MAX_TOKENS: ${CLAUDE_CONTENT_MAX_TOKENS:-8000}
      # Approval expiry (ADR-006) and the recorded approver (no auth).
      APPROVAL_PENDING_TTL: ${APPROVAL_PENDING_TTL:-15m}
      APPROVAL_APPROVED_TTL: ${APPROVAL_APPROVED_TTL:-24h}
      APPROVER_NAME: ${APPROVER_NAME:-marketer@demo}
    depends_on:
      seed:
        condition: service_completed_successfully
    # Internal only; the browser reaches it through the frontend proxy.
    expose: ["8080"]
    healthcheck:
      # /readyz: database reachable and schema at a clean migrated version.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  # Fake SMS/email provider (ADR-020): durable idempotency ledger and fault
  # injection; no outbound connections. Internal only. The ledger lives on
  # the mockledger volume: restart, `down`/`up` and container recreation keep
  # it (replays work across them); only `docker compose down -v` (or the
  # opt-in admin reset) destroys it. A corrupt ledger stops the service
  # (fail closed), and the worker then does not start.
  mockprovider:
    <<: *backend
    command: ["/app/mockprovider"]
    volumes:
      - mockledger:/var/lib/mockprovider
    environment:
      MOCK_PROVIDER_ADDR: ":8090"
      MOCK_LEDGER_PATH: /var/lib/mockprovider/ledger.journal
      # Destructive POST /admin/reset; off in the demo stack.
      MOCK_ADMIN_RESET_ENABLED: "false"
      MOCK_FAULT_5XX_RATE: ${MOCK_FAULT_5XX_RATE:-0.03}
      MOCK_FAULT_429_RATE: ${MOCK_FAULT_429_RATE:-0.01}
      MOCK_FAULT_TIMEOUT_RATE: ${MOCK_FAULT_TIMEOUT_RATE:-0.005}
      MOCK_LATENCY_MS: ${MOCK_LATENCY_MS:-50-200}
      # Destinations ending with this suffix are rejected permanently ("-" disables).
      MOCK_PERMANENT_FAIL_PATTERN: ${MOCK_PERMANENT_FAIL_PATTERN:-0000}
      MOCK_RANDOM_SEED: ${MOCK_RANDOM_SEED:-1}
      # The mock's own strict per-channel limit (requests per rolling second;
      # 0 disables). The worker stays below it; violations are counted in
      # /admin/stats as limit_exceeded.
      MOCK_RATE_LIMIT_PER_SECOND: ${MOCK_RATE_LIMIT_PER_SECOND:-100}
    depends_on:
      api:
        condition: service_healthy
    expose: ["8090"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Delivery worker: claims only rows released by an explicit send (consumed
  # approval of a sending campaign). One replica: the rate limiter is
  # in-process; an accidental second process stands by (PostgreSQL dispatch
  # lock, ADR-025) instead of doubling the rate. It also runs the
  # approval-expiry sweeper, the lease reaper and the heartbeat.
  worker:
    <<: *backend
    command: ["/app/worker"]
    environment:
      <<: *backend-env
      WORKER_ID: worker
      WORKER_METRICS_ADDR: ":9091"
      PROVIDER_BASE_URL: http://mockprovider:8090
      PROVIDER_REQUEST_TIMEOUT: ${PROVIDER_REQUEST_TIMEOUT:-5s}
      SENDER_POOL_SIZE: ${SENDER_POOL_SIZE:-20}
      CLAIM_BATCH_SIZE: ${CLAIM_BATCH_SIZE:-50}
      LEASE_DURATION: ${LEASE_DURATION:-60s}
      WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-500ms}
      MAX_TRANSIENT_ATTEMPTS: ${MAX_TRANSIENT_ATTEMPTS:-5}
      MAX_RATE_LIMITED_ATTEMPTS: ${MAX_RATE_LIMITED_ATTEMPTS:-10}
      BACKOFF_BASE: ${BACKOFF_BASE:-1s}
      BACKOFF_CAP: ${BACKOFF_CAP:-60s}
      RETRY_AFTER_CAP: ${RETRY_AFTER_CAP:-30s}
      RATE_LIMIT_PER_SECOND: ${RATE_LIMIT_PER_SECOND:-100}
      RATE_SAFETY_MARGIN: ${RATE_SAFETY_MARGIN:-50ms}
      DISPATCH_MAX_SLOT_TO_REQUEST: ${DISPATCH_MAX_SLOT_TO_REQUEST:-20ms}
      DISPATCH_MAX_PRECHECK: ${DISPATCH_MAX_PRECHECK:-15ms}
      APPROVAL_SWEEP_INTERVAL: ${APPROVAL_SWEEP_INTERVAL:-30s}
    depends_on:
      seed:
        condition: service_completed_successfully
      mockprovider:
        condition: service_healthy
    expose: ["9091"]
    # SIGTERM → stop claiming, finish in-flight requests (≤ 10 s), release the rest.
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9091/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: campaign-composer/frontend:local
    environment:
      API_UPSTREAM: api:8080
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Loopback only: the demo stack uses development credentials.
      - "127.0.0.1:${COMPOSER_HTTP_PORT:-8000}:8080"
    read_only: true
    # Writable paths for the read-only container (uid 101 = nginx): pid/temp
    # files and the config rendered from the template at start.
    tmpfs:
      - /tmp:uid=101,gid=101,mode=0700
      - /etc/nginx/conf.d:uid=101,gid=101,mode=0755
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  # Mock provider idempotency ledger (mounted only in mockprovider).
  mockledger:
